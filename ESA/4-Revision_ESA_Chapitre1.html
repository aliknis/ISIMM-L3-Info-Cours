<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Révision ESA Chapitre 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Concept : plan d'architecte. Papier millimétré bleu, encre marine, un seul orange de repérage. */
:root{
  --paper:#EDF1F6; --card:#FFFFFF; --ink:#0E1E33; --muted:#51647C; --line:#C4D0E0; --grid:#DCE4EE;
  --blue:#1D4ED8; --on-blue:#FFFFFF; --blue-soft:#DCE6FB;
  --signal:#C2410C; --signal-soft:#FDE6DA;
  --ok:#0F7B4B; --ok-soft:#D5F1E3; --bad:#B42318; --bad-soft:#FBE0DD;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0A1829; --card:#112238; --ink:#E7EEF8; --muted:#9FB2C8; --line:#2B4767; --grid:#0F2339;
    --blue:#7FB0FF; --on-blue:#06101F; --blue-soft:#17325C;
    --signal:#FF9B6A; --signal-soft:#3A2218;
    --ok:#4FD09A; --ok-soft:#10382A; --bad:#FF8C80; --bad-soft:#41191A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0A1829; --card:#112238; --ink:#E7EEF8; --muted:#9FB2C8; --line:#2B4767; --grid:#0F2339;
  --blue:#7FB0FF; --on-blue:#06101F; --blue-soft:#17325C;
  --signal:#FF9B6A; --signal-soft:#3A2218;
  --ok:#4FD09A; --ok-soft:#10382A; --bad:#FF8C80; --bad-soft:#41191A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink); font-family:var(--body); font-size:clamp(16px,0.55vw + 11px,24px); line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 3em;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.72em;letter-spacing:.09em;text-transform:uppercase}

/* en-tête collant */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);border-bottom:2px solid var(--ink);padding-block:.7em .6em}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2em 1em;margin-bottom:.5em}
.brand h1{font-size:1.5em;font-weight:800}
.brand .mono{color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:.4em}
.tab{display:flex;align-items:center;gap:.5em;padding:.45em .9em;border:2px solid var(--ink);background:var(--card);border-radius:.35em;font-weight:600;min-width:0}
.tab b{font-family:var(--mono);font-size:.8em;display:inline-grid;place-items:center;width:1.7em;height:1.7em;border:1.5px solid currentColor;border-radius:50%}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tab:hover{background:var(--blue-soft)}
.tab[aria-selected="true"]:hover{background:var(--ink)}
.themebtn{margin-left:auto;padding:.45em .8em;border:2px solid var(--line);background:transparent;border-radius:.35em;color:var(--muted);font-size:.85em}

/* titre de partie */
.hero{padding-block:1.4em .6em;display:grid;gap:.5em}
.hero h2{font-size:2.3em;font-weight:800}
.hero p{margin:0;max-width:46em;color:var(--muted);font-size:1.05em}
.hook{display:inline-block;border:2px dashed var(--signal);color:var(--signal);padding:.35em .8em;border-radius:.3em;font-weight:600;max-width:46em}

.subtabs{display:flex;flex-wrap:wrap;gap:.3em;margin-block:.8em 1em;border-bottom:2px solid var(--line)}
.sub{padding:.5em 1em;border:none;background:none;font-weight:600;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px}
.sub[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}
.sub:hover{color:var(--ink)}

.panel{display:grid;gap:1em}
.card{background:var(--card);border:2px solid var(--ink);border-radius:.5em;padding:1em 1.2em;min-width:0}
.card h3{font-size:1.25em;margin-bottom:.4em}
.lead{font-size:1.05em;color:var(--muted);margin:0}

/* essentiel */
.points{display:grid;grid-template-columns:repeat(auto-fit,minmax(15em,1fr));gap:1em}
.point{display:grid;gap:.4em;align-content:start}
.point .n{font-family:var(--display);font-size:2.4em;font-weight:800;color:var(--blue);line-height:1}
.point p{margin:0}
.agence{border:2px dashed var(--signal);border-radius:.5em;padding:1em 1.2em;background:var(--signal-soft)}
.agence .mono{color:var(--signal);display:block;margin-bottom:.4em}
.agence p{margin:.2em 0}
.visual{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{border:1.5px solid var(--line);padding:.5em .7em;text-align:left;vertical-align:top}
th{background:var(--blue-soft);font-family:var(--display)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(12em,1fr));gap:.8em;align-items:stretch}
.box{border:2px solid var(--ink);border-radius:.4em;padding:.7em .9em;background:var(--card);min-width:0}
.box.b{background:var(--blue-soft)} .box.s{background:var(--signal-soft)}
.box h4{margin:0 0 .2em;font-family:var(--display);font-size:1.1em}
.box p{margin:0;font-size:.9em;color:var(--muted)}
.arrow{font-family:var(--mono);color:var(--signal);font-weight:600;text-align:center;align-self:center}
.layers{display:grid;gap:.4em;max-width:30em}
.layers .box{text-align:center}
.steps6{display:grid;grid-template-columns:repeat(auto-fit,minmax(11em,1fr));gap:.6em;counter-reset:s}
.steps6 .box{counter-increment:s}
.steps6 .box::before{content:counter(s);font-family:var(--mono);font-weight:600;color:var(--signal);display:block}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(11em,1fr));gap:.6em}
.tl .box h4{color:var(--blue)}

/* cartes à retourner */
.toolbar{display:flex;flex-wrap:wrap;gap:.5em;align-items:center}
.btn{padding:.5em 1.1em;border:2px solid var(--ink);background:var(--card);border-radius:.35em;font-weight:600}
.btn:hover{background:var(--blue-soft)}
.btn.primary{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:default}
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(15em,1fr));gap:.9em}
.flip{perspective:900px;border:none;background:none;padding:0;min-height:11em;text-align:left}
.flip .in{display:block}
.flip .in{position:relative;width:100%;height:100%;min-height:11em;transform-style:preserve-3d;transition:transform .45s}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--ink);border-radius:.5em;padding:.8em 1em;display:flex;flex-direction:column;justify-content:center;gap:.3em;overflow:auto}
.face.f{background:var(--card)}
.face.f strong{font-family:var(--display);font-size:1.25em}
.face.f .mono{color:var(--muted)}
.face.k{background:var(--blue);color:var(--on-blue);transform:rotateY(180deg);font-size:.95em}

/* quiz */
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5em;align-items:center}
.bar{height:.55em;background:var(--line);border-radius:1em;overflow:hidden;flex:1;min-width:6em}
.bar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.q{font-family:var(--display);font-size:1.5em;font-weight:600;line-height:1.25;margin:.6em 0}
.opts{display:grid;gap:.6em}
.opt{display:flex;gap:.8em;align-items:flex-start;text-align:left;padding:.7em 1em;border:2px solid var(--ink);background:var(--card);border-radius:.45em;min-width:0}
.opt .l{font-family:var(--mono);font-weight:600;flex:none;width:1.9em;height:1.9em;display:grid;place-items:center;border:1.5px solid currentColor;border-radius:.3em}
.opt:hover:not(:disabled){background:var(--blue-soft)}
.opt.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.opt:disabled{cursor:default}
.fb{margin-top:.8em;padding:.8em 1em;border-radius:.45em;border:2px solid var(--line);background:var(--card)}
.fb.good{border-color:var(--ok)} .fb.bad{border-color:var(--bad)}
.fb strong{display:block;font-family:var(--display);font-size:1.15em}
.fb.good strong{color:var(--ok)} .fb.bad strong{color:var(--bad)}
.score{font-family:var(--display);font-size:3.4em;font-weight:800;line-height:1}
.pbars{display:grid;gap:.4em;margin-top:.8em}
.pbar{display:grid;grid-template-columns:minmax(7em,12em) 1fr auto;gap:.6em;align-items:center}

/* classer / ordre / arbre */
.sortcard{text-align:center;padding:1.2em}
.sortitem{font-family:var(--display);font-size:1.6em;font-weight:600;margin:.3em auto .8em;max-width:26em;text-wrap:balance}
.buckets{display:flex;flex-wrap:wrap;gap:.6em;justify-content:center}
.bucket{padding:.7em 1.3em;border:2px solid var(--ink);background:var(--card);border-radius:.45em;font-weight:600;min-width:9em}
.bucket small{display:block;font-weight:400;color:var(--muted)}
.bucket:hover:not(:disabled){background:var(--blue-soft)}
.bucket.good{background:var(--ok-soft);border-color:var(--ok)} .bucket.bad{background:var(--bad-soft);border-color:var(--bad)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pool{display:flex;flex-wrap:wrap;gap:.5em}
.chip{padding:.5em .9em;border:2px solid var(--ink);background:var(--card);border-radius:.4em;text-align:left}
.chip:hover:not(:disabled){background:var(--blue-soft)}
.chip:disabled{opacity:.35;cursor:default}
.seq{display:grid;gap:.4em;counter-reset:q;margin:.5em 0}
.seq .slot{border:2px dashed var(--line);border-radius:.4em;padding:.4em .9em;min-height:2.4em;display:flex;gap:.7em;align-items:center}
.seq .slot::before{counter-increment:q;content:counter(q);font-family:var(--mono);font-weight:600;color:var(--muted)}
.seq .slot.fill{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.tree .qq{font-family:var(--display);font-size:1.5em;font-weight:600;margin:.3em 0 .8em}
.trail{display:flex;flex-wrap:wrap;gap:.4em;margin-bottom:.6em}
.trail span{padding:.2em .7em;border-radius:2em;background:var(--blue-soft);font-size:.85em}
.result{border:3px solid var(--blue);border-radius:.5em;padding:1em 1.2em;background:var(--card)}
.result h3{font-size:1.8em;color:var(--blue)}

/* TD */
.timer{font-family:var(--mono);font-size:1.6em;font-weight:600;min-width:3.6em;text-align:center}
.timer.low{color:var(--bad)}
.stepbox{display:grid;gap:.6em}
.corr{border-top:2px dashed var(--line);padding-top:.6em;display:grid;gap:.4em}
.corr[hidden]{display:none}
.tag{display:inline-block;padding:.05em .55em;border-radius:.3em;background:var(--blue-soft);font-family:var(--mono);font-size:.8em}
.pk{color:var(--signal);font-weight:600}
.tbl{display:inline-block;margin:.3em .5em .3em 0;border:2px solid var(--ink);border-radius:.4em;background:var(--card);vertical-align:top}
.tbl div:first-child{background:var(--ink);color:var(--paper);font-family:var(--display);font-weight:600;padding:.25em .8em}
.tbl div+div{padding:.15em .8em;font-family:var(--mono);font-size:.85em}
.fine{color:var(--muted);font-size:.9em;margin:0}
@media (max-width:620px){.hero h2{font-size:1.8em}.pbar{grid-template-columns:1fr auto}.pbar .bar{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Révision ESA · Chapitre 1</h1>
      <span class="mono">Architecture des systèmes d’entreprise · 3ème Licence · ISIMM</span>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Parties du chapitre"></div>
  </div>
</header>
<main class="wrap" id="main">
  <div class="hero" id="hero"></div>
  <div class="subtabs" id="subtabs" role="tablist" aria-label="Activités"></div>
  <div class="panel" id="panel" aria-live="polite"></div>
</main>
<script>
/* Contenu fidèle au support de cours. Chaque partie : recap, visual, agence, cards, activities, quiz, td. */
var PARTS = [];

PARTS.push({
  id: 'p1', tab: 'Système', num: '1',
  title: 'Le système d’entreprise',
  intro: 'Une entreprise est un ensemble de systèmes en interaction. On apprend à les distinguer, puis à situer le système d’information et le système informatique.',
  hook: 'Question d’accroche : vous commandez un repas sur une application. Combien de systèmes interviennent ?',
  recap: [
    ['L’entreprise est un système', 'Trois sous-systèmes en interaction : pilotage (SP), information (SI) et opérant (SO).'],
    ['SI et système informatique', 'Le SI regroupe toute l’information de l’entreprise. Le système informatique est sa partie informatisée.'],
    ['Pourquoi informatiser ?', 'Productivité, meilleures conditions de travail, meilleur service, aide à la décision.']
  ],
  visual: '<div class="flow">' +
    '<div class="box s"><h4>SO · Opérant</h4><p>Transforme et produit. Cœur de métier.</p></div>' +
    '<div class="arrow">informations élémentaires →<br>← ordres, informations globales</div>' +
    '<div class="box b"><h4>SI · Information</h4><p>Collecte, mémorise, traite et diffuse. Transforme en information élaborée.</p></div>' +
    '<div class="arrow">informations élaborées →<br>← décisions</div>' +
    '<div class="box"><h4>SP · Pilotage</h4><p>Réfléchir, décider, contrôler la qualité.</p></div></div>' +
    '<p class="fine" style="margin-top:.8em">Le SI est un outil de communication interne : il relie le terrain (SO) à la direction (SP).</p>',
  agence: ['Opérant : agents au comptoir, garage, voitures.', 'Information : fiches de réservation, contrats, factures.', 'Pilotage : la direction fixe les tarifs et la taille de la flotte.', 'Question : le cahier papier des réservations fait-il partie du SI ? du système informatique ?  Réponse : il fait partie du SI, mais pas du système informatique.'],
  cards: [
    ['Système', 'Ensemble d’éléments en interaction dynamique, organisé en fonction d’un but.'],
    ['Système d’entreprise (SE)', 'Ressources (personnel, matériel, logiciel…) qui participent à 4 opérations sur l’information : stocker, classer, traiter, diffuser.'],
    ['SP · Système de pilotage', 'Système de décision : réfléchir (adaptation, conception), décider (prévoir, planifier), contrôler la qualité.'],
    ['SI · Système d’information', 'La mémoire et le lien : générer, mémoriser, diffuser et traiter l’information.'],
    ['SO · Système opérant', 'Le cœur de métier : transformer et produire.'],
    ['Système informatique', 'La partie du SI qui peut être automatisée, donc qui tourne sur des ordinateurs.'],
    ['Informatiser le SI', 'Développer des logiciels qui représentent des parties du SI.'],
    ['Aide à la décision', 'Business intelligence : synthèses et prévisions pour décider.']
  ],
  activities: [
    { type: 'sort', title: 'Qui fait quoi dans l’agence ?', intro: 'Pour chaque élément de l’agence de location, choisissez le sous-système.',
      buckets: [['SP', 'Pilotage'], ['SI', 'Information'], ['SO', 'Opérant']],
      items: [
        ['La direction fixe les tarifs de location', 0, 'Fixer les prix, c’est décider : pilotage.'],
        ['Les fiches de réservation, contrats et factures', 1, 'Mémoriser et faire circuler l’information : système d’information.'],
        ['L’agent remet les clés au client au comptoir', 2, 'Servir le client est le cœur de métier : opérant.'],
        ['Le garage prépare et nettoie les voitures', 2, 'Transformer et produire le service : opérant.'],
        ['Décider la taille de la flotte pour l’été', 0, 'Prévoir et planifier : pilotage.'],
        ['Le tableau de bord remonte les locations du mois', 1, 'Il collecte et traite l’information pour la direction : SI. La décision, elle, reste au pilotage.'],
        ['Contrôler la qualité du service rendu', 0, 'Contrôler la qualité fait partie du pilotage.']
      ] },
    { type: 'sort', title: 'Informatisé ou pas ?', intro: 'Tout cela fait partie du SI. Lesquels sont dans le système informatique ?',
      buckets: [['Reste dans le SI', 'non informatisé'], ['Système informatique', 'partie informatisée']],
      items: [
        ['Le carnet de commandes papier', 0, 'Papier : il appartient au SI sans être informatisé.'],
        ['Le logiciel de caisse', 1, 'Un logiciel est la partie informatisée du SI.'],
        ['La réunion du lundi matin', 0, 'L’information circule, mais pas par ordinateur.'],
        ['La base de données des clients', 1, 'Données stockées sur ordinateur : système informatique.'],
        ['La note de service affichée', 0, 'Information diffusée sur papier : SI non informatisé.'],
        ['Le logiciel de paie', 1, 'Partie informatisée du SI.'],
        ['La procédure papier de congés', 0, 'Papier : reste dans le SI.']
      ] }
  ],
  quiz: [
    { q: 'Un directeur ouvre une agence à l’aide d’un tableau de bord. Quel sous-système décide ?', o: ['Le système opérant', 'Le système d’information', 'Le système de pilotage', 'Aucun des trois'], a: 2, e: 'Le SI fournit le tableau de bord, mais la décision relève du pilotage (réfléchir, décider, contrôler).' },
    { q: 'Lequel de ces éléments relève du système informatique ?', o: ['Une procédure papier de congés', 'Une note de service affichée', 'La réunion hebdomadaire', 'Le logiciel de paie'], a: 3, e: 'Le système informatique est la partie informatisée du SI. Les trois autres restent dans le SI sans être informatisés.' },
    { q: 'Dans une pizzeria, le gérant qui fixe les prix relève de quel sous-système ?', o: ['Pilotage (SP)', 'Opérant (SO)', 'Information (SI)', 'Aucun des trois'], a: 0, e: 'Le pilotage décide et fixe les objectifs. La cuisine est l’opérant, la caisse relève de l’information.' },
    { q: 'Quelles sont les 4 opérations sur l’information du système d’entreprise ?', o: ['Stocker, classer, traiter, diffuser', 'Créer, lire, modifier, supprimer', 'Produire, vendre, livrer, facturer', 'Planifier, décider, contrôler, adapter'], a: 0, e: 'Le système d’entreprise stocke, classe, traite et diffuse l’information.' },
    { q: 'Une entreprise sans aucun ordinateur possède-t-elle un système d’information ?', o: ['Non, il faut des ordinateurs', 'Oui, toute entreprise possède un SI', 'Seulement si elle a un logiciel de paie', 'Seulement une grande entreprise'], a: 1, e: 'Toute entreprise possède un SI. Informatiser, c’est en automatiser une partie.' }
  ],
  td: { title: 'TD · Le système d’une clinique vétérinaire', enonce: 'Une clinique vétérinaire reçoit des animaux, tient un dossier par animal, et le directeur décide des horaires et des tarifs.', minutes: 8,
    steps: [
      ['Classez : vétérinaires et assistants en consultation, dossiers des animaux, directeur.', 'Opérant : vétérinaires et assistants (ils soignent). Information : dossiers des animaux. Pilotage : le directeur (horaires, tarifs).'],
      ['Donnez un exemple d’information élémentaire et un d’information élaborée.', 'Élémentaire : une consultation enregistrée. Élaborée : le nombre de consultations par mois, remonté au directeur. Le SI collecte et traite pour produire l’information élaborée.'],
      ['Le registre papier des vaccinations : SI ou système informatique ?', 'Il fait partie du SI, mais pas du système informatique, car il n’est pas informatisé.'],
      ['Citez deux raisons d’informatiser ce SI.', 'Par exemple : productivité (retrouver un dossier plus vite) et aide à la décision (statistiques pour fixer les tarifs).']
    ] }
});

PARTS.push({
  id: 'p2', tab: 'Architecture', num: '2',
  title: 'Architecture d’un système d’entreprise',
  intro: 'Deux échelles à ne pas confondre : l’architecture d’entreprise (la ville) et l’architecture logicielle (la maison). Puis trois patrons pour organiser un logiciel.',
  hook: 'Question : quels composants pour une application de réservation de voiture ?',
  recap: [
    ['L’ESA aligne', 'L’architecture d’entreprise aligne l’informatique sur les objectifs : stratégie, métier, technologie.'],
    ['L’architecture logicielle organise', 'Composants actifs + mécanisme d’interaction + règles qui gouvernent l’interaction.'],
    ['Concevoir', 'Définir la structure, choisir des patrons, viser les exigences non fonctionnelles, choisir les technologies.']
  ],

          if (k === next) {
            slots[next].classList.add('fill');
            slots[next].innerHTML = '<span><b>' + a.steps[k][0] + '</b> <span class="fine">' + a.steps[k][1] + '</span></span>';
            c.disabled = true; next++; fb.hidden = true;
            if (next === n) {
              fb.hidden = false; fb.className = 'fb good';
              fb.innerHTML = '<strong>Séquence complète</strong>' + (errs ? errs + ' erreur' + (errs > 1 ? 's' : '') + ' en chemin.' : 'Sans aucune erreur.');
              $('#again').hidden = false;
            }
          } else {
            errs++; c.classList.add('shake');
            setTimeout(function () { c.classList.remove('shake'); }, 400);
            fb.hidden = false; fb.className = 'fb bad'; fb.innerHTML = '<strong>Ce n’est pas la suivante</strong>Quelle étape vient après « ' + (next ? a.steps[next - 1][0] : 'le départ') + ' » ?';
          }
        });
      });
      $('#again').addEventListener('click', draw);
    }
    draw();
  }

  function treeAct(host, a) {
    var hist, answers, result;
    function reset() { hist = [a.start]; answers = []; result = null; }
    function draw() {
      var node = a.nodes[hist[hist.length - 1]];
      var trail = answers.map(function (v, k) { return '<span>' + a.nodes[hist[k]].q + ' → ' + (v === 'y' ? 'Oui' : 'Non') + '</span>'; }).join('');
      var body;
      if (result) {
        body = '<div class="result"><span class="mono">Méthode suggérée</span><h3>' + result[0] + '</h3><p>' + result[1] + '</p></div><p class="fine" style="margin-top:.6em">' + (a.note || '') + '</p>' +
          '<div class="toolbar" style="margin-top:.6em"><button class="btn" data-v="back">Retour</button><button class="btn primary" data-v="reset">Recommencer</button></div>';
      } else {
        body = '<div class="qq">' + node.q + '</div><div class="toolbar"><button class="btn primary" data-v="y">Oui</button><button class="btn primary" data-v="n">Non</button>' + (answers.length ? '<button class="btn" data-v="back">Retour</button>' : '') + '</div>';
      }
      host.innerHTML = '<div class="card tree"><div class="trail">' + trail + '</div>' + body + '</div>';
      Array.prototype.forEach.call(host.querySelectorAll('[data-v]'), function (b) {
        b.addEventListener('click', function () {
          var v = b.dataset.v;
          if (v === 'reset') reset();
          else if (v === 'back') { if (result) { result = null; answers.pop(); } else { hist.pop(); answers.pop(); } }
          else { var nx = node[v]; answers.push(v); if (typeof nx === 'string') hist.push(nx); else result = nx.r; }
          draw();
        });
      });
    }
    reset(); draw();
  }

  /* ---------- quiz ---------- */
  function runQuiz(host, qsFn, firstShuffle) {
    var list, i, score, state, wrong, byPart;
    function start(shuf) {
      var qs = qsFn().map(function (q) {
        var opts = q.o.map(function (t, k) { return { t: t, ok: k === q.a }; });
        return { q: q.q, e: q.e, part: q.part, opts: shuf ? shuffle(opts) : opts };
      });
      list = shuf ? shuffle(qs) : qs; i = 0; score = 0; wrong = []; byPart = {};
      draw();
    }
    function draw() {
      if (i >= list.length) return finish();
      var q = list[i]; state = 'ask';
      host.innerHTML = '<div class="card"><div class="qhead"><span class="mono">Question ' + (i + 1) + ' / ' + list.length + '</span><div class="bar"><i style="width:' + (i / list.length * 100) + '%"></i></div><span class="mono">Score ' + score + '</span></div>' +
        '<div class="q">' + q.q + '</div><div class="opts">' + q.opts.map(function (o, k) {
          return '<button class="opt" data-k="' + k + '"><span class="l">' + 'ABCD'.charAt(k) + '</span><span>' + o.t + '</span></button>';
        }).join('') + '</div><div class="fb" hidden></div><div class="toolbar" style="margin-top:.8em"><button class="btn primary" id="nx" hidden>' + (i + 1 === list.length ? 'Voir le résultat' : 'Question suivante') + '</button></div></div>';
      Array.prototype.forEach.call(host.querySelectorAll('.opt'), function (b) {
        b.addEventListener('click', function () { choose(+b.dataset.k); });
      });
      $('#nx').addEventListener('click', function () { i++; draw(); });
      activeQuiz = { choose: choose, state: function () { return state; }, next: function () { var n = $('#nx'); if (n && !n.hidden) n.click(); } };
    }
    function choose(k) {
      if (state !== 'ask') return;
      var q = list[i], ok = q.opts[k] && q.opts[k].ok;
      if (!q.opts[k]) return;
      state = 'fb';
      var bs = host.querySelectorAll('.opt'), fb = host.querySelector('.fb');
      Array.prototype.forEach.call(bs, function (b, j) { b.disabled = true; if (q.opts[j].ok) b.classList.add('good'); else if (j === k) b.classList.add('bad'); });
      if (q.part) { byPart[q.part] = byPart[q.part] || { ok: 0, n: 0 }; byPart[q.part].n++; if (ok) byPart[q.part].ok++; }
      if (ok) score++; else wrong.push(q);
      fb.hidden = false; fb.className = 'fb ' + (ok ? 'good' : 'bad');
      fb.innerHTML = '<strong>' + (ok ? 'Bonne réponse' : 'Pas tout à fait') + '</strong>' + q.e;
      var nx = $('#nx'); nx.hidden = false; nx.focus();
    }
    function finish() {
      activeQuiz = null;
      var n = list.length, r = score / n;
      var msg = r === 1 ? 'Sans faute.' : r >= 0.75 ? 'Très bien : les bases sont solides.' : r >= 0.5 ? 'Bien parti : revoyez les cartes et les points manqués.' : 'À retravailler : reprenez l’essentiel, puis les cartes.';
      var parts = Object.keys(byPart).map(function (id) {
        var p = getPart(id), b = byPart[id];
        return '<div class="pbar"><span>' + partLabel(p) + '</span><div class="bar"><i style="width:' + (b.ok / b.n * 100) + '%"></i></div><span class="mono">' + b.ok + ' / ' + b.n + '</span></div>';
      }).join('');
      var rev = wrong.length ? '<h3 style="margin-top:1em;font-size:1.15em">À revoir</h3>' + wrong.map(function (q) {
        var good = q.opts.filter(function (o) { return o.ok; })[0].t;
        return '<p style="margin:.3em 0"><b>' + q.q + '</b><br><span class="fine">Réponse : ' + good + '</span></p>';
      }).join('') : '';
      host.innerHTML = '<div class="card"><span class="mono">Résultat</span><div class="score">' + score + ' / ' + n + '</div><p class="lead">' + msg + '</p>' +
        (parts ? '<div class="pbars">' + parts + '</div>' : '') + rev +
        '<div class="toolbar" style="margin-top:1em"><button class="btn primary" id="again">Rejouer (ordre mélangé)</button></div></div>';
      $('#again').addEventListener('click', function () { start(true); });
    }
    start(!!firstShuffle);
  }

  document.addEventListener('keydown', function (e) {
    if (!activeQuiz || e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target; if (t && /INPUT|TEXTAREA|SELECT/.test(t.tagName)) return;
    var k = 'abcd1234'.indexOf(e.key.toLowerCase());
    if (k >= 0 && e.key.length === 1 && activeQuiz.state() === 'ask') { activeQuiz.choose(k % 4); e.preventDefault(); }
    else if (e.key === 'ArrowRight' && activeQuiz.state() === 'fb') { activeQuiz.next(); }
  });

  /* ---------- TD ---------- */
  function renderTD(p) {
    var td = p.td, secs = td.minutes * 60, run = null;
    function fmt(s) { var m = Math.floor(s / 60), r = s % 60; return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; }
    panel.innerHTML = '<div class="card"><div class="qhead" style="align-items:flex-start"><div style="flex:1;min-width:14em"><h3>' + td.title + '</h3><p class="lead">' + td.enonce + '</p><p class="fine" style="margin-top:.4em">Travaillez en binôme pendant ' + td.minutes + ' minutes, puis corrigez étape par étape.</p></div>' +
      '<div class="toolbar"><span class="timer" id="tm">' + fmt(secs) + '</span><button class="btn primary" id="tgo">Démarrer</button><button class="btn" id="trs">Remettre</button></div></div></div>' +
      td.steps.map(function (s, k) {
        return '<div class="card stepbox"><div><span class="tag">Question ' + (k + 1) + '</span></div><div class="q" style="font-size:1.25em;margin:.1em 0">' + s[0] + '</div>' +
          '<div><button class="btn" data-k="' + k + '">Voir la correction</button></div><div class="corr" hidden>' + s[1] + '</div></div>';
      }).join('') + '<div class="toolbar"><button class="btn" id="tall">Tout corriger</button></div>';
    var tm = $('#tm'), go = $('#tgo');
    function stop() { if (run) { clearInterval(run); run = null; } go.textContent = secs === 0 ? 'Terminé' : 'Reprendre'; }
    go.addEventListener('click', function () {
      if (run) { stop(); return; }
      if (secs === 0) return;
      go.textContent = 'Pause';
      run = setInterval(function () {
        secs--; tm.textContent = fmt(secs); tm.className = 'timer' + (secs <= 60 ? ' low' : '');
        if (secs <= 0) { stop(); }
      }, 1000);
      timers.push(run);
    });
    $('#trs').addEventListener('click', function () { if (run) { clearInterval(run); run = null; } secs = td.minutes * 60; tm.textContent = fmt(secs); tm.className = 'timer'; go.textContent = 'Démarrer'; });
    Array.prototype.forEach.call(panel.querySelectorAll('[data-k]'), function (b) {
      b.addEventListener('click', function () {
        var c = b.parentNode.nextElementSibling; c.hidden = !c.hidden;
        b.textContent = c.hidden ? 'Voir la correction' : 'Masquer la correction';
      });
    });
    $('#tall').addEventListener('click', function () {
      var cs = panel.querySelectorAll('.corr'), show = Array.prototype.some.call(cs, function (c) { return c.hidden; });
      Array.prototype.forEach.call(cs, function (c) { c.hidden = !show; c.parentNode.querySelector('[data-k]').textContent = show ? 'Masquer la correction' : 'Voir la correction'; });
      this.textContent = show ? 'Tout masquer' : 'Tout corriger';
    });
  }

  /* ---------- défi final ---------- */
  function renderDefiHero() {
    $('#hero').innerHTML = '<span class="mono">Pour finir</span><h2>Défi final</h2><p>Dix questions tirées au hasard dans toutes les parties : deux par partie. Le résultat montre quelle partie revoir.</p>';
  }
  function renderDefi() {
    panel.innerHTML = '<div class="card"><h3>Prêt ?</h3><p class="lead">Chaque lancement tire de nouvelles questions. Au clavier : A, B, C, D (ou 1 à 4) pour répondre, flèche droite pour continuer.</p><div class="toolbar" style="margin-top:.8em"><button class="btn primary" id="go">Lancer le défi</button></div></div>';
    $('#go').addEventListener('click', function () {
      runQuiz(panel, function () {
        var out = [];
        PARTS.forEach(function (p) {
          shuffle(p.quiz).slice(0, 2).forEach(function (q) { out.push({ q: q.q, o: q.o, a: q.a, e: q.e, part: p.id }); });
        });
        return out;
      }, true);
    });
  }

  /* ---------- démarrage ---------- */
  var h = (location.hash || '').replace('#', '');
  if (h === 'defi' || getPart(h)) { S.part = h; S.sub = h === 'defi' ? 'defi' : 'ess'; }
  render();
  window.addEventListener('hashchange', function () {
    var x = (location.hash || '').replace('#', '');
    if ((x === 'defi' || getPart(x)) && x !== S.part) go(x);
  });
})();
</script>

</body></html>
